name: cutover-dev

x-common: &common
  restart: unless-stopped
  labels:
    dev.cutover.project: cutover
    dev.cutover.profile: dev
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

x-java: &java
  <<: *common
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:size=64m,mode=1777']
  mem_limit: 768m
  cpus: 1.5
  healthcheck:
    test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9091; printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3; IFS= read -r status <&3; [[ \"$$status\" == *' 200 '* ]]"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 15s

x-application-env: &application-env
  CUTOVER_MIGRATIONS_ENABLED: 'false'
  CUTOVER_ISSUER: http://localhost:8780/identity/realms/cutover
  CUTOVER_JWKS_URI: http://keycloak:8080/identity/realms/cutover/protocol/openid-connect/certs
  CUTOVER_TOKEN_URI: http://keycloak:8080/identity/realms/cutover/protocol/openid-connect/token
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_VIRTUAL_HOST: cutover

x-identity-env: &identity-env
  KC_DB_URL: jdbc:postgresql://application-db:5432/cutover_keycloak
  KC_DB_USERNAME: cutover_keycloak_runtime
  KC_DB_PASSWORD: ${CUTOVER_KEYCLOAK_RUNTIME}
  KC_HTTP_ENABLED: 'true'
  KC_HTTP_RELATIVE_PATH: /identity
  KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
  KC_HOSTNAME: http://localhost:8780/identity
  KC_PROXY_HEADERS: xforwarded
  KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: ${CUTOVER_KEYCLOAK_ADMIN}
  JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=20

x-identity: &identity
  <<: *common
  image: ${CUTOVER_KEYCLOAK_IMAGE}
  pull_policy: never
  command: [start, --optimized, --import-realm]
  mem_limit: 1g
  cpus: 2
  networks: [application]
  volumes: [./.local/secrets/realm:/opt/keycloak/data/import:ro]
  environment: *identity-env
  healthcheck:
    test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; IFS= read -r status <&3; [[ \"$$status\" == *' 200 '* ]]"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 20s

x-migrate: &migrate
  <<: *common
  restart: 'no'
  profiles: [migrations]
  pull_policy: never
  mem_limit: 512m
  entrypoint: [java, -Dloader.main=dev.cutover.platform.MigrationMain, -cp, /app/app.jar, org.springframework.boot.loader.launch.PropertiesLauncher]
  networks: [application]

services:
  application-db:
    <<: *common
    image: ${CUTOVER_POSTGRES_IMAGE}
    mem_limit: 512m
    networks: [application]
    environment: { POSTGRES_PASSWORD: '${CUTOVER_POSTGRES_ADMIN}', POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256' }
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=100, -c, timezone=UTC]
    volumes: [application-data:/var/lib/postgresql, ./.local/secrets/application-init.sql:/docker-entrypoint-initdb.d/010-owners.sql:ro]
    healthcheck: { test: [CMD-SHELL, 'pg_isready -U postgres'], interval: 3s, timeout: 3s, retries: 30 }
  simulator-db:
    <<: *common
    image: ${CUTOVER_POSTGRES_IMAGE}
    mem_limit: 384m
    networks: [equipment]
    environment: { POSTGRES_PASSWORD: '${CUTOVER_SIMULATOR_POSTGRES_ADMIN}', POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256' }
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=40, -c, timezone=UTC]
    volumes: [equipment-data:/var/lib/postgresql, ./.local/secrets/simulator-init.sql:/docker-entrypoint-initdb.d/010-owner.sql:ro]
    healthcheck: { test: [CMD-SHELL, 'pg_isready -U postgres'], interval: 3s, timeout: 3s, retries: 30 }
  rabbitmq:
    <<: *common
    image: ${CUTOVER_RABBITMQ_IMAGE}
    mem_limit: 512m
    hostname: cutover-rabbitmq
    networks: [application]
    environment: { RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2' }
    volumes: [broker-data:/var/lib/rabbitmq, ./infra/compose/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro, ./.local/secrets/rabbit-definitions.json:/etc/rabbitmq/definitions.json:ro]
    healthcheck: { test: [CMD, rabbitmq-diagnostics, -q, ping], interval: 5s, timeout: 5s, retries: 24 }
  identity-migrate:
    <<: *identity
    profiles: [migrations]
    restart: 'no'
    environment:
      <<: *identity-env
      KC_DB_USERNAME: cutover_keycloak_migrator
      KC_DB_PASSWORD: ${CUTOVER_KEYCLOAK_MIGRATOR}
  keycloak:
    <<: *identity
  migrate-core:
    <<: *migrate
    image: ${CUTOVER_LEGACY_CORE_IMAGE}
    environment:
      CUTOVER_DATABASE_URL: jdbc:postgresql://application-db:5432/cutover_core
      CUTOVER_DATABASE_USER: cutover_core_migrator
      CUTOVER_DATABASE_PASSWORD: ${CUTOVER_CORE_MIGRATOR}
      CUTOVER_MIGRATION_LOCATIONS: classpath:db/platform,classpath:db/legacy-core
  migrate-adapter:
    <<: *migrate
    image: ${CUTOVER_EQUIPMENT_ADAPTER_IMAGE}
    environment:
      CUTOVER_DATABASE_URL: jdbc:postgresql://application-db:5432/cutover_adapter
      CUTOVER_DATABASE_USER: cutover_adapter_migrator
      CUTOVER_DATABASE_PASSWORD: ${CUTOVER_ADAPTER_MIGRATOR}
      CUTOVER_MIGRATION_LOCATIONS: classpath:db/platform,classpath:db/equipment-adapter
  migrate-simulator:
    <<: *migrate
    image: ${CUTOVER_EQUIPMENT_SIMULATOR_IMAGE}
    networks: [equipment]
    environment:
      CUTOVER_DATABASE_URL: jdbc:postgresql://simulator-db:5432/cutover_simulator
      CUTOVER_DATABASE_USER: cutover_simulator_migrator
      CUTOVER_DATABASE_PASSWORD: ${CUTOVER_SIMULATOR_MIGRATOR}
      CUTOVER_MIGRATION_LOCATIONS: classpath:db/platform,classpath:db/equipment-simulator
  equipment-simulator:
    <<: *java
    image: ${CUTOVER_EQUIPMENT_SIMULATOR_IMAGE}
    pull_policy: never
    networks: [equipment, equipment-access]
    ports: [127.0.0.1:18784:8443]
    volumes:
      - ./.local/secrets/equipment/simulator.p12:/etc/cutover/simulator.p12:ro
      - ./.local/secrets/equipment/trust.p12:/etc/cutover/trust.p12:ro
    environment:
      CUTOVER_DATABASE_URL: jdbc:postgresql://simulator-db:5432/cutover_simulator
      CUTOVER_DATABASE_USER: cutover_simulator_runtime
      CUTOVER_DATABASE_PASSWORD: ${CUTOVER_SIMULATOR_RUNTIME}
      CUTOVER_SIMULATOR_KEY_STORE: file:/etc/cutover/simulator.p12
      CUTOVER_EQUIPMENT_TRUST_STORE: file:/etc/cutover/trust.p12
      CUTOVER_EQUIPMENT_STORE_PASSWORD: ${CUTOVER_EQUIPMENT_STORE}
      CUTOVER_SIMULATOR_TEST_CONTROLS_ENABLED: 'true'
      CUTOVER_MIGRATIONS_ENABLED: 'false'
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
  equipment-adapter:
    <<: *java
    image: ${CUTOVER_EQUIPMENT_ADAPTER_IMAGE}
    pull_policy: never
    networks: [application, equipment]
    volumes:
      - ./.local/secrets/equipment/adapter.p12:/etc/cutover/adapter.p12:ro
      - ./.local/secrets/equipment/trust.p12:/etc/cutover/trust.p12:ro
    environment:
      <<: *application-env
      CUTOVER_DATABASE_URL: jdbc:postgresql://application-db:5432/cutover_adapter
      CUTOVER_DATABASE_USER: cutover_adapter_runtime
      CUTOVER_DATABASE_PASSWORD: ${CUTOVER_ADAPTER_RUNTIME}
      CUTOVER_EQUIPMENT_URL: https://equipment-simulator:8443
      CUTOVER_ADAPTER_KEY_STORE: /etc/cutover/adapter.p12
      CUTOVER_EQUIPMENT_TRUST_STORE: /etc/cutover/trust.p12
      CUTOVER_EQUIPMENT_STORE_PASSWORD: ${CUTOVER_EQUIPMENT_STORE}
      SPRING_RABBITMQ_USERNAME: cutover_adapter
      SPRING_RABBITMQ_PASSWORD: ${CUTOVER_RABBIT_ADAPTER}
  legacy-core:
    <<: *java
    image: ${CUTOVER_LEGACY_CORE_IMAGE}
    pull_policy: never
    networks: [application]
    environment:
      <<: *application-env
      CUTOVER_DATABASE_URL: jdbc:postgresql://application-db:5432/cutover_core
      CUTOVER_DATABASE_USER: cutover_core_runtime
      CUTOVER_DATABASE_PASSWORD: ${CUTOVER_CORE_RUNTIME}
      CUTOVER_ADAPTER_URL: http://equipment-adapter:8080
      CUTOVER_CLIENT_SECRET: ${CUTOVER_CLIENT_LEGACY_CORE}
      SPRING_RABBITMQ_USERNAME: cutover_core
      SPRING_RABBITMQ_PASSWORD: ${CUTOVER_RABBIT_CORE}
  proxy:
    <<: *common
    image: ${CUTOVER_PROXY_IMAGE}
    mem_limit: 96m
    networks: [application, browser-access]
    ports: [127.0.0.1:8780:8080]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    volumes: [./infra/compose/proxy.conf:/etc/nginx/conf.d/default.conf:ro, ./infra/compose/baseline-console:/usr/share/nginx/html:ro]
    healthcheck: { test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/healthz], interval: 5s, timeout: 3s, retries: 12 }

networks:
  browser-access: { name: cutover-dev-browser-access, labels: { dev.cutover.project: cutover } }
  equipment-access: { name: cutover-equipment-access, labels: { dev.cutover.project: cutover } }
  application: { name: cutover-dev-application, internal: true, labels: { dev.cutover.project: cutover } }
  equipment: { name: cutover-equipment, internal: true, labels: { dev.cutover.project: cutover } }
volumes:
  application-data: { name: cutover-dev-application-data, labels: { dev.cutover.project: cutover } }
  broker-data: { name: cutover-dev-broker-data, labels: { dev.cutover.project: cutover } }
  equipment-data: { name: cutover-equipment-data, labels: { dev.cutover.project: cutover } }
