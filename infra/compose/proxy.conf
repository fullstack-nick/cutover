log_format cutover '$request_method $uri $status $request_time';
server {
    listen 8080;
    server_name localhost;
    access_log /dev/stdout cutover;
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /healthz { access_log off; return 200 'ready'; }
    location /identity/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8780;
        proxy_pass http://keycloak:8080;
    }
    location ~ ^/api/v1/sites/[^/]+/(orders|tasks)(/|$) {
        proxy_pass http://legacy-core:8080;
    }
    location ~ ^/api/v1/sites/[^/]+/(equipment|commands|zones|migrations|audit)(/|$) {
        proxy_pass http://equipment-adapter:8080;
    }
    location /api/ { return 404; }
    location /internal/ { return 404; }
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
