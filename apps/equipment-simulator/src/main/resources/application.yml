spring:
  application:
    name: equipment-simulator
  datasource:
    url: ${CUTOVER_DATABASE_URL}
    username: ${CUTOVER_DATABASE_USER}
    password: ${CUTOVER_DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 3000
  flyway:
    locations: classpath:db/platform,classpath:db/equipment-simulator
    enabled: ${CUTOVER_MIGRATIONS_ENABLED:false}
  jooq:
    sql-dialect: POSTGRES
management:
  server:
    port: ${CUTOVER_MANAGEMENT_PORT:9091}
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: ecs
server:
  port: ${CUTOVER_HTTP_PORT:8443}
  ssl:
    enabled: true
    key-store: ${CUTOVER_SIMULATOR_KEY_STORE}
    key-store-password: ${CUTOVER_EQUIPMENT_STORE_PASSWORD}
    key-store-type: PKCS12
    trust-store: ${CUTOVER_EQUIPMENT_TRUST_STORE}
    trust-store-password: ${CUTOVER_EQUIPMENT_STORE_PASSWORD}
    trust-store-type: PKCS12
    client-auth: need
    enabled-protocols: TLSv1.3,TLSv1.2
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    threads:
      max: 32
    max-connections: 200
cutover:
  service-name: equipment-simulator
  workers-enabled: ${CUTOVER_WORKERS_ENABLED:true}
